# Security & Anti-DDoS Rate Limiting Zones (in HTTP context)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /var/www/html/public;

    # Anti-DDoS & Concurrent Connection Control
    limit_conn conn_limit 40;
    limit_req zone=general_limit burst=60 nodelay;

    # Security: Hide Nginx version
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    index index.php index.html;
    charset utf-8;
    client_max_body_size 100M;

    # High performance static file delivery
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Health check endpoint
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP FastCGI execution
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    # Security: Strictly block execution of other PHP files
    location ~* \.(php|phtml|phar|inc|sh|pl|py|cgi)$ {
        deny all;
        return 404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Security: Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Security: Block sensitive files
    location ~* \.(sql|sqlite|log|env|git|lock|json|md|yml|yaml|bak|backup|old|conf)$ {
        deny all;
        return 404;
    }
}

