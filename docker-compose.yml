services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: real-estate-platform-app:latest
    container_name: real-estate-platform-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3009}:3000"
    environment:
      APP_NAME: "${APP_NAME:-Real Estate Platform}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:3009}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Africa/Cairo}"
      APP_LOCALE: "${APP_LOCALE:-ar}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"

      # Shared MariaDB
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-shared-mariadb}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-real_estate_platform}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-Heba101088}"

      # Shared Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: "${REDIS_HOST:-shared-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_STORE: redis
      CACHE_PREFIX: real_estate_cache_
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      QUEUE_CONNECTION: redis

      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      LARAVEL_CACHE: "${LARAVEL_CACHE:-true}"

    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs

    networks:
      - shared-network

networks:
  shared-network:
    external: true

volumes:
  app_storage:
  app_logs:
