services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: real-estate-platform-app:latest
    container_name: real-estate-platform-app
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    ports:
      - "${APP_PORT:-3009}:3000"
    environment:
      APP_NAME: "${APP_NAME:-Real Estate Platform}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:3009}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Africa/Cairo}"
      APP_LOCALE: "${APP_LOCALE:-ar}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"

      # Shared MariaDB - Local
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-shared-mariadb}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-real_estate_platform}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-Heba101088}"

      # Shared Redis - Local
      REDIS_CLIENT: phpredis
      REDIS_HOST: "${REDIS_HOST:-shared-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_STORE: redis
      CACHE_PREFIX: real_estate_cache_
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      QUEUE_CONNECTION: redis

      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      LARAVEL_CACHE: "false"

    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - app_build:/var/www/html/public/build
      - app_logs:/var/www/html/storage/logs

    networks:
      - shared-network

networks:
  shared-network:
    external: true

volumes:
  app_build:
  app_storage:
  app_logs:

